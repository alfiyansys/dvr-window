<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DVR Window — Playback</title>
<script src="/static/vendor/hls.min.js"></script>
<script src="/static/auth.js"></script>
<link rel="stylesheet" href="/static/shared.css">
<link rel="stylesheet" href="/static/playback.css">
</head>
<body>
<a class="nav" href="/">&larr; Live View</a>
<h1>Playback</h1>

<div class="controls">
  <select id="channel"></select>
  <input type="date" id="date">
  <button id="searchBtn">Search recordings</button>
  <span style="color:#555">|</span>
  <input type="datetime-local" id="jumpDatetime" step="1">
  <button id="jumpBtn">Jump to time</button>
</div>

<div class="layout">
  <div class="segments" id="segments"><div class="empty">Select a channel &amp; date, then click "Search recordings".</div></div>
  <div class="player">
    <div class="bar">
      <span id="playerLabel">nothing playing</span>
      <span id="downloadControls" style="display:none">
        <input type="time" id="downloadStart" step="1" style="width:100px" title="start time (within this recording day)">
        &ndash;
        <input type="time" id="downloadEnd" step="1" style="width:100px" title="end time">
        <button id="downloadBtn">Download ⬇</button>
        <button id="snapshotBtn">Snapshot 📷</button>
        <button id="stopBtn">Stop</button>
      </span>
    </div>
    <video id="video" muted controls playsinline></video>
    <div class="timeline" id="timeline"></div>
  </div>
</div>

<script src="/static/playback.js"></script>
</body>
</html>
