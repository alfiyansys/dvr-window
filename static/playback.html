<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<title>Hikvision Local Service — Playback</title>
<script src="/static/vendor/hls.min.js"></script>
<style>
  body { background: #111; color: #eee; font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; }
  a.nav { color: #93c5fd; font-size: 13px; }
  .controls { display: flex; gap: 8px; align-items: center; margin: 16px 0; flex-wrap: wrap; }
  select, input, button { background: #1c1c1c; color: #eee; border: 1px solid #333; border-radius: 4px; padding: 6px 10px; font-size: 13px; }
  button { cursor: pointer; }
  button:hover { background: #2a2a2a; }
  .layout { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .segments { flex: 0 0 320px; max-height: 480px; overflow-y: auto; border: 1px solid #333; border-radius: 6px; }
  .segment { padding: 8px 10px; border-bottom: 1px solid #262626; font-size: 13px; cursor: pointer; }
  .segment:hover { background: #1c1c1c; }
  .segment.active { background: #1e3a5f; }
  .player { flex: 1 1 480px; background: #000; border: 1px solid #333; border-radius: 6px; overflow: hidden; }
  .player video { width: 100%; display: block; background: #000; aspect-ratio: 16/9; }
  .player .bar { padding: 8px 10px; font-size: 13px; color: #aaa; display: flex; justify-content: space-between; }
  .empty { padding: 12px; color: #888; font-size: 13px; }
</style>
</head>
<body>
<a class="nav" href="/static/index.html">&larr; Live View</a>
<h1>Playback</h1>

<div class="controls">
  <select id="channel"></select>
  <input type="date" id="date">
  <button id="searchBtn">Cari rekaman</button>
</div>

<div class="layout">
  <div class="segments" id="segments"><div class="empty">Pilih channel &amp; tanggal, lalu klik "Cari rekaman".</div></div>
  <div class="player">
    <div class="bar">
      <span id="playerLabel">tidak ada yang diputar</span>
      <span id="downloadControls" style="display:none">
        <input type="number" id="downloadSeconds" value="30" min="1" max="300" style="width:60px" title="durasi (detik)"> detik
        <button id="downloadBtn">Download ⬇</button>
        <button id="stopBtn">Stop</button>
      </span>
    </div>
    <video id="video" muted controls playsinline></video>
  </div>
</div>

<script>
let hls = null;
let currentPlaybackName = null;
let currentChannelId = null;
let currentSeg = null;
let channels = [];

async function loadChannels() {
  const res = await fetch('/api/channels');
  channels = (await res.json()).filter(c => c.enabled);
  const sel = document.getElementById('channel');
  sel.innerHTML = channels.map(c => `<option value="${c.id}">${c.name}</option>`).join('');
}

// The DVR's ISAPI timestamps are labeled "Z" (UTC) but are actually its
// own local wall-clock digits, unconverted (confirmed by extracting a
// playback frame and reading the DVR's on-screen timestamp — it matched
// the raw ISAPI digits exactly, not a UTC-shifted version of them). So
// these strings must be read and written as literal digits, never through
// `new Date(...)`/`toISOString()`/`toLocaleTimeString()`, which would
// apply the browser's own timezone on top and produce the wrong time
// whenever the browser isn't set to the DVR's zone (WIB).
function fmtTime(iso) {
  const m = iso.match(/T(\d{2}):(\d{2}):(\d{2})/);
  return m ? `${m[1]}.${m[2]}.${m[3]}` : iso;
}

async function search() {
  const channelId = document.getElementById('channel').value;
  const date = document.getElementById('date').value;
  if (!date) { alert('Pilih tanggal dulu'); return; }

  const start = `${date}T00:00:00Z`;
  const end = `${date}T23:59:59Z`;

  const container = document.getElementById('segments');
  container.innerHTML = '<div class="empty">Mencari…</div>';

  const res = await fetch(`/api/recordings?channelId=${channelId}&start=${encodeURIComponent(start)}&end=${encodeURIComponent(end)}`);
  const data = await res.json();

  if (data.segments.length === 0) {
    container.innerHTML = '<div class="empty">Tidak ada rekaman di rentang ini.</div>';
    return;
  }

  container.innerHTML = '';
  for (const seg of data.segments) {
    const el = document.createElement('div');
    el.className = 'segment';
    el.textContent = `${fmtTime(seg.startTime)} – ${fmtTime(seg.endTime)}`;
    el.onclick = () => play(channelId, seg, el);
    container.appendChild(el);
  }
}

async function stopCurrent() {
  if (currentPlaybackName) {
    await fetch('/api/playback/stop', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: currentPlaybackName }),
    });
    currentPlaybackName = null;
  }
  if (hls) { hls.destroy(); hls = null; }
  document.getElementById('downloadControls').style.display = 'none';
  document.getElementById('playerLabel').textContent = 'tidak ada yang diputar';
  currentChannelId = null;
  currentSeg = null;
}

async function play(channelId, seg, el) {
  await stopCurrent();
  document.querySelectorAll('.segment.active').forEach(e => e.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('playerLabel').textContent = 'memuat…';
  currentChannelId = channelId;
  currentSeg = seg;

  const res = await fetch('/api/playback/start', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ channelId: Number(channelId), startTime: seg.startTime, endTime: seg.endTime }),
  });
  if (!res.ok) {
    document.getElementById('playerLabel').textContent = 'gagal memulai playback';
    return;
  }
  const { name, hlsPath, hlsPort } = await res.json();
  currentPlaybackName = name;

  const video = document.getElementById('video');
  const url = `http://${location.hostname}:${hlsPort}${hlsPath}`;
  hls = new Hls({ lowLatencyMode: false });
  hls.loadSource(url);
  hls.attachMedia(video);
  hls.on(Hls.Events.MANIFEST_PARSED, () => {
    video.play();
    document.getElementById('playerLabel').textContent = `${fmtTime(seg.startTime)} – ${fmtTime(seg.endTime)}`;
    document.getElementById('downloadControls').style.display = 'inline-flex';
  });
}

async function downloadClip() {
  if (!currentSeg || currentChannelId == null) return;
  const seconds = Math.max(1, Math.min(300, Number(document.getElementById('downloadSeconds').value) || 30));
  // Pure duration arithmetic on the DVR's timestamp digits (Date parses the
  // "Z" string and toISOString() emits it back the same way) — NOT the same
  // as the toLocaleTimeString() display conversion that caused the earlier
  // timezone bug, since no browser-local timezone is applied here.
  const startTime = currentSeg.startTime;
  const endTime = new Date(new Date(startTime).getTime() + seconds * 1000).toISOString().replace(/\.\d{3}Z$/, 'Z');

  const btn = document.getElementById('downloadBtn');
  const originalText = btn.textContent;
  btn.textContent = 'Menyiapkan…';
  btn.disabled = true;
  try {
    const res = await fetch('/api/download', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ channelId: Number(currentChannelId), startTime, endTime }),
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      alert(`Download gagal: ${err.detail || res.statusText}`);
      return;
    }
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `ch${currentChannelId}_${startTime.replace(/[:T]/g, '-').replace('Z','')}.mp4`;
    a.click();
    URL.revokeObjectURL(url);
  } finally {
    btn.textContent = originalText;
    btn.disabled = false;
  }
}

document.getElementById('searchBtn').onclick = search;
document.getElementById('stopBtn').onclick = stopCurrent;
document.getElementById('downloadBtn').onclick = downloadClip;
document.getElementById('date').valueAsDate = new Date();

loadChannels();
</script>
</body>
</html>
