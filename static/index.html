<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DVR Window</title>
<script src="/static/vendor/hls.min.js"></script>
<script src="/static/auth.js"></script>
<style>
  body { background: #111; color: #eee; font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
  h1 { font-size: 18px; font-weight: 600; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 12px; }
  .cell { background: #000; border: 1px solid #333; border-radius: 6px; overflow: hidden; cursor: pointer; }
  .cell:hover { border-color: #666; }
  .cell video { width: 100%; display: block; background: #000; aspect-ratio: 16/9; pointer-events: none; }
  .cell .label { padding: 6px 10px; font-size: 13px; color: #aaa; display: flex; justify-content: space-between; }
  .cell .status { font-size: 11px; }
  .status.ok { color: #4ade80; }
  .status.err { color: #f87171; }
  .status.loading { color: #fbbf24; }

  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 10; align-items: center; justify-content: center; padding: 32px; }
  .overlay.open { display: flex; }
  .overlay-box { max-width: 1280px; width: 100%; max-height: calc(100vh - 64px); background: #000; border: 1px solid #333; border-radius: 6px; overflow-x: hidden; overflow-y: auto; }
  .overlay-box video { display: block; margin: 0 auto; background: #000; max-width: 100%; max-height: 60vh; aspect-ratio: 16/9; }
  .overlay-box .label { padding: 8px 12px; font-size: 14px; color: #ddd; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .overlay-box .label .actions { display: flex; gap: 8px; }
  .overlay-box button { cursor: pointer; color: #aaa; font-size: 14px; background: #1c1c1c; border: 1px solid #333; border-radius: 4px; padding: 4px 10px; }
  .overlay-box button:hover { background: #2a2a2a; color: #eee; }

  /* Browser fullscreen stretches the element to the viewport, but the
     max-width/max-height above (sized for the modal look) would clip
     it to the same box it had before — override both dimensions and
     drop the rounded/bordered modal chrome only while fullscreen. */
  .overlay-box:fullscreen, .overlay-box:-webkit-full-screen {
    max-width: 100%; max-height: 100%; width: 100%; height: 100%;
    border: none; border-radius: 0;
  }
  .overlay-box:fullscreen video, .overlay-box:-webkit-full-screen video {
    max-height: 100%;
  }

  .ptz { display: none; grid-template-columns: repeat(3, 36px); grid-template-rows: repeat(3, 36px); gap: 4px; padding: 10px 12px; justify-content: center; }
  .ptz.open { display: grid; }
  .ptz button { padding: 0; font-size: 16px; user-select: none; }
  .ptz .zoom { display: flex; gap: 8px; justify-content: center; padding: 0 12px 10px; }

  /* Wide viewport (enough room for a sidebar, landscape phone or any
     normal desktop window): move controls beside the video instead of
     below it, so the video can use the full available height instead of
     competing with the label/PTZ pad/zoom row for it. Triggered on
     width, not height — a desktop window is "landscape-shaped" (wide)
     regardless of how tall it happens to be. */
  @media (min-width: 700px) {
    .overlay-box { display: flex; flex-direction: row; }
    .overlay-video-col { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; overflow: hidden; }
    .overlay-box video { max-height: calc(100vh - 64px); max-width: 100%; width: auto; }
    .overlay-side { width: 200px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px; padding: 12px; overflow-y: auto; border-left: 1px solid #333; }
    .overlay-side .label { flex-direction: column; align-items: stretch; padding: 0; gap: 8px; }
    .overlay-side .label .actions { flex-direction: column; }
  }

  @media (min-width: 700px) and (max-height: 500px) {
    .overlay { padding: 8px; }
    .overlay-box { max-height: calc(100vh - 16px); }
    .overlay-box video { max-height: calc(100vh - 16px); }
    .overlay-side { width: 160px; padding: 8px; }
    .ptz { padding: 4px 0; }
  }
</style>
</head>
<body>
<h1>Live View</h1>
<a href="/playback" style="color:#93c5fd;font-size:13px;">Playback &rarr;</a>
<div id="grid" class="grid"></div>

<div id="overlay" class="overlay">
  <div class="overlay-box">
    <div class="overlay-video-col">
      <div id="overlaySlot"></div>
    </div>
    <div class="overlay-side">
      <div class="label">
        <span id="overlayName"></span>
        <div class="actions">
          <button id="overlaySnapshot">Snapshot 📷</button>
          <button id="overlayPlayback">Playback ▶</button>
          <button id="overlayPrev">◂ Prev</button>
          <button id="overlayNext">Next ▸</button>
          <button id="overlayFullscreen">Fullscreen ⛶</button>
          <button id="overlayClose">Close ✕</button>
        </div>
      </div>
      <div id="ptzPad" class="ptz">
        <span></span><button data-pan="0" data-tilt="50">&uarr;</button><span></span>
        <button data-pan="-50" data-tilt="0">&larr;</button><span></span><button data-pan="50" data-tilt="0">&rarr;</button>
        <span></span><button data-pan="0" data-tilt="-50">&darr;</button><span></span>
      </div>
      <div id="ptzZoom" class="ptz zoom" style="grid-template-columns:none;display:none;">
        <button data-zoom="50">Zoom +</button>
        <button data-zoom="-50">Zoom &minus;</button>
      </div>
    </div>
  </div>
</div>

<script>
let overlayChannelId = null;

function openOverlay(cell, name, channelId, ptzEnabled) {
  const slot = document.getElementById('overlaySlot');
  const video = cell.querySelector('video');
  cell.dataset.videoHome = '1';
  video._homeCell = cell;
  slot.appendChild(video);
  document.getElementById('overlayName').textContent = name;
  overlayChannelId = channelId;
  document.getElementById('overlay').classList.add('open');
  document.getElementById('ptzPad').classList.toggle('open', !!ptzEnabled);
  document.getElementById('ptzZoom').style.display = ptzEnabled ? 'flex' : 'none';
}

// PTZ is continuous-move: hold to move, release to stop (see
// ARCHITECTURE.md "PTZ for IP-proxy channels" — only pan-right was
// physically confirmed to move the camera; other directions follow the
// same documented ISAPI sign convention but aren't independently verified).
function ptzSend(pan, tilt, zoom) {
  if (overlayChannelId == null) return;
  authFetch(`/api/ptz/${overlayChannelId}/continuous`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pan, tilt, zoom }),
  });
}

function ptzStop() {
  if (overlayChannelId == null) return;
  authFetch(`/api/ptz/${overlayChannelId}/stop`, { method: 'PUT' });
}

for (const btn of document.querySelectorAll('#ptzPad button')) {
  const pan = Number(btn.dataset.pan);
  const tilt = Number(btn.dataset.tilt);
  btn.addEventListener('pointerdown', () => ptzSend(pan, tilt, 0));
  btn.addEventListener('pointerup', ptzStop);
  btn.addEventListener('pointerleave', ptzStop);
}
for (const btn of document.querySelectorAll('#ptzZoom button')) {
  const zoom = Number(btn.dataset.zoom);
  btn.addEventListener('pointerdown', () => ptzSend(0, 0, zoom));
  btn.addEventListener('pointerup', ptzStop);
  btn.addEventListener('pointerleave', ptzStop);
}

document.getElementById('overlaySnapshot').onclick = async () => {
  if (overlayChannelId == null) return;
  // A plain <a href> can't carry the X-Auth-Key header the /api/*
  // middleware now requires, so fetch as a blob and download that instead.
  const res = await authFetch(`/api/snapshot?channelId=${overlayChannelId}`);
  if (!res.ok) return;
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `snapshot_ch${overlayChannelId}_${Date.now()}.jpg`;
  a.click();
  URL.revokeObjectURL(url);
};

document.getElementById('overlayPlayback').onclick = () => {
  if (overlayChannelId == null) return;
  location.href = `/playback?channelId=${overlayChannelId}`;
};

function returnSlottedVideoHome() {
  const slot = document.getElementById('overlaySlot');
  const video = slot.querySelector('video');
  if (video && video._homeCell) {
    video._homeCell.insertBefore(video, video._homeCell.firstChild);
  }
}

// Standard Fullscreen API, with the -webkit- prefixed names old
// Safari still needs (no vendor-neutral fallback for iOS Safari,
// which only exposes video-only webkitEnterFullscreen — accepted
// limitation, not handled here).
function isFullscreen() {
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}

function toggleFullscreen() {
  const box = document.querySelector('.overlay-box');
  if (!isFullscreen()) {
    (box.requestFullscreen || box.webkitRequestFullscreen)?.call(box);
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  }
}

function updateFullscreenButton() {
  document.getElementById('overlayFullscreen').textContent = isFullscreen() ? 'Exit Fullscreen ⛶' : 'Fullscreen ⛶';
}
document.addEventListener('fullscreenchange', updateFullscreenButton);
document.addEventListener('webkitfullscreenchange', updateFullscreenButton);
document.getElementById('overlayFullscreen').onclick = toggleFullscreen;

function closeOverlay() {
  if (isFullscreen()) (document.exitFullscreen || document.webkitExitFullscreen)?.call(document);
  returnSlottedVideoHome();
  ptzStop();
  document.getElementById('overlay').classList.remove('open');
}

// Cycles to the adjacent camera in grid order without closing the
// overlay — wraps around at either end. Reads channel metadata off the
// cell's own dataset (set in main() below) rather than re-fetching,
// since these buttons have no closure over the clicked cell the way
// openOverlay's caller does.
function showAdjacent(step) {
  if (overlayChannelId == null) return;
  const cells = Array.from(document.querySelectorAll('#grid .cell'));
  if (cells.length < 2) return;
  const currentIndex = cells.findIndex(c => Number(c.dataset.channelId) === overlayChannelId);
  if (currentIndex === -1) return;
  const next = cells[(currentIndex + step + cells.length) % cells.length];
  ptzStop();
  returnSlottedVideoHome();
  openOverlay(next, next.dataset.name, Number(next.dataset.channelId), next.dataset.ptzEnabled === 'true');
}
const showNext = () => showAdjacent(1);
const showPrev = () => showAdjacent(-1);

document.getElementById('overlayNext').onclick = showNext;
document.getElementById('overlayPrev').onclick = showPrev;
document.getElementById('overlayClose').onclick = closeOverlay;
document.getElementById('overlay').addEventListener('click', (e) => {
  if (e.target.id === 'overlay') closeOverlay();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeOverlay();
  if (!document.getElementById('overlay').classList.contains('open')) return;
  if (e.key === 'ArrowRight') showNext();
  if (e.key === 'ArrowLeft') showPrev();
});

async function main() {
  const res = await authFetch('/api/streams');
  const data = await res.json();
  const grid = document.getElementById('grid');

  for (const ch of data.channels) {
    const mainStream = ch.streams.find(s => s.kind === 'main');
    if (!mainStream) continue;

    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.dataset.channelId = ch.id;
    cell.dataset.name = ch.name;
    cell.dataset.ptzEnabled = ch.ptzEnabled ? 'true' : 'false';
    cell.innerHTML = `
      <video muted autoplay playsinline></video>
      <div class="label"><span>${ch.name}</span><span class="status loading">connecting…</span></div>
    `;
    grid.appendChild(cell);
    cell.onclick = () => openOverlay(cell, ch.name, ch.id, ch.ptzEnabled);

    const video = cell.querySelector('video');
    const status = cell.querySelector('.status');
    const hlsUrl = `http://${location.hostname}:${data.hlsPort}${mainStream.hlsPath}`;

    if (Hls.isSupported()) {
      const hls = new Hls({ lowLatencyMode: true, xhrSetup: hlsXhrSetup });
      hls.loadSource(hlsUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => { status.textContent = 'live'; status.className = 'status ok'; });
      hls.on(Hls.Events.ERROR, (_evt, data) => {
        if (data.fatal) { status.textContent = 'error'; status.className = 'status err'; }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = hlsUrl;
      video.addEventListener('loadedmetadata', () => { status.textContent = 'live'; status.className = 'status ok'; });
    } else {
      status.textContent = 'HLS not supported';
      status.className = 'status err';
    }
  }
}

ensureAuthKey().then(main);
</script>
</body>
</html>
