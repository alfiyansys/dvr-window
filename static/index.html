<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DVR Window</title>
<script src="/static/vendor/hls.min.js"></script>
<script src="/static/auth.js"></script>
<link rel="stylesheet" href="/static/shared.css">
<link rel="stylesheet" href="/static/index.css">
</head>
<body>
<h1>Live View</h1>
<a href="/playback" style="color:#93c5fd;font-size:13px;">Playback &rarr;</a>
<div id="grid" class="grid"></div>

<div id="overlay" class="overlay">
  <div class="overlay-box">
    <div class="overlay-video-col">
      <div id="overlaySlot"></div>
      <!-- Phase 15.1: sibling of #overlaySlot, not a child of it - the
           slot's own contents get replaced by whichever channel's <video>
           is currently focused, and existing code (returnSlottedVideoHome)
           looks up "the video inside the slot" directly, so this canvas
           must live outside that lookup's reach. Hidden by default (CSS
           below); shown in place of the (visually hidden, still decoding)
           video only while enhancement is actually running. -->
      <canvas id="enhanceCanvas"></canvas>
    </div>
    <div class="overlay-side">
      <div class="label">
        <span class="overlay-title"><span id="overlayName"></span><span id="overlayStatus" class="status loading"></span><span id="overlayPing" class="ping"></span></span>
        <div class="actions">
          <button id="overlaySnapshot">Snapshot 📷</button>
          <button id="overlayPlayback">Playback ▶</button>
          <div class="actions-pager">
            <button id="overlayPrev">◂ Prev</button>
            <button id="overlayNext">Next ▸</button>
          </div>
          <button id="overlayEnhance">Enhance: Off</button>
          <button id="overlayFullscreen">Fullscreen ⛶</button>
          <button id="overlayClose">Close ✕</button>
        </div>
      </div>
      <div id="ptzPad" class="ptz">
        <span></span><button data-pan="0" data-tilt="50">&uarr;</button><span></span>
        <button data-pan="-50" data-tilt="0">&larr;</button><span></span><button data-pan="50" data-tilt="0">&rarr;</button>
        <span></span><button data-pan="0" data-tilt="-50">&darr;</button><span></span>
      </div>
      <div id="ptzZoom" class="ptz zoom" style="grid-template-columns:none;display:none;">
        <button data-zoom="50">Zoom +</button>
        <button data-zoom="-50">Zoom &minus;</button>
      </div>
    </div>
  </div>
</div>

<!-- After the overlay HTML, not in <head> like auth.js/hls.min.js -
     enhance.js looks up #overlayEnhance/#enhanceCanvas at load time and
     needs them to already exist, unlike auth.js which only ever builds
     its own elements dynamically. -->
<script src="/static/enhance.js"></script>
<script src="/static/index.js"></script>
</body>
</html>
