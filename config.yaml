# Non-secret device/server configuration. The DVR password is NOT stored
# here — it's read from the HIKVISION_PASSWORD environment variable
# (see .env.example) so it never ends up in git history.

device:
  host: <redacted-dvr-host>
  http_port: 80
  rtsp_port: 554
  username: <redacted-username>

server:
  host: 127.0.0.1
  port: 8896
