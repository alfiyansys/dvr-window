# Non-identifying device/server configuration (ports only). The DVR's
# host, username, and password are NOT stored here — they're read from
# HIKVISION_HOST/HIKVISION_USERNAME/HIKVISION_PASSWORD environment
# variables (see .env.example) so nothing identifying this specific
# device ends up in git history.

device:
  http_port: 80
  rtsp_port: 554

server:
  host: 127.0.0.1
  port: 8896
