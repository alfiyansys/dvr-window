services:
  dvr-window:
    image: registry.gitlab.com/alfiyansys/dvr-window:${IMAGE_TAG:-latest}
    environment:
      - HIKVISION_HOST=${HIKVISION_HOST}
      - HIKVISION_USERNAME=${HIKVISION_USERNAME}
    secrets:
      - hikvision_password
      - auth_key
    ports:
      - "8888:8888"
      - "8889:8889"
    networks:
      - traefik-public
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1.0"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 128M
      labels:
        - traefik.enable=true
        - traefik.http.routers.dvr-window.rule=Host(`${DVR_DOMAIN}`)
        - traefik.http.routers.dvr-window.entrypoints=web
        - traefik.http.services.dvr-window.loadbalancer.server.port=8896
      restart_policy:
        condition: on-failure

networks:
  traefik-public:
    external: true

secrets:
  hikvision_password:
    external: true
  auth_key:
    external: true
